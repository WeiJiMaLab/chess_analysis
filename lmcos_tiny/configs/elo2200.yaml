# ============================================================================
# elo2200 — single source of truth for the Stockfish-2200 rung of the ladder.
# One section per pipeline stage; each section is the EXACT flat config its entry
# point consumes (pydantic extra="forbid"). pipeline/*/*.slurm slice a section
# with configs/render_stage.py and pass it as `--config FILE`.
#
# Paths are spelled out in full (no derivation) so this file shows the whole rung
# at a glance. Across rungs only `sf_elo` and the `elo2200` path component differ.
#
#   Phase 1 (CPU)  tree gen + pack trees : treegen, split, gnn_pack, mc_pack
#   Phase 2 (GPU)  train encoder + reps  : encoder, materialize
#   Phase 3 (GPU)  train readout (MCHalt): train
#   Phase 4 (CPU)  eval                  : eval
# ============================================================================

# ── Phase 1 ─────────────────────────────────────────────────────────────────
# stage: tree gen  ->  cts.data.build_tree   (gen_trees.slurm passes start/end_index)
treegen:
  command: generate-dataset
  provider: stockfish
  engine_path: /home/hl4291/stockfish/src/stockfish
  fens: /scratch/gpfs/GRIFFITHS/hl4291/sf_ladder_roots_50k.txt
  output_dir: /scratch/gpfs/GRIFFITHS/hl4291/sf_trees/elo2200
  search_budget: 96
  min_nodes: 96
  max_nodes: 96
  max_depth: 4
  sf_elo: 2200
  sf_search_limit_nodes: 100
  seed: 42
  resume: true
  log_interval: 50

# stage: train/val split  ->  cts.data.preprocess_gnn.split
split:
  source_root: /scratch/gpfs/GRIFFITHS/hl4291/sf_trees/elo2200
  split_root: /scratch/gpfs/GRIFFITHS/hl4291/sf_split/elo2200
  validation_fraction: 0.2
  seed: 0
  clear: true

# stage: GNN pack (encoder training examples)  ->  cts.data.preprocess_gnn.pack
gnn_pack:
  split_root: /scratch/gpfs/GRIFFITHS/hl4291/sf_split/elo2200
  output_root: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2200
  shard_size: 2000
  clear: true

# stage: MC pack (budgeted-DP oracle episodes)  ->  cts.data.preprocess_mc.pack
# num_workers is overridden to $SLURM_CPUS_PER_TASK at submit time.
mc_pack:
  split_root: /scratch/gpfs/GRIFFITHS/hl4291/sf_split/elo2200
  output_root: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_packed/elo2200
  shard_size: 500
  num_workers: 32
  reward_scale: 1.0
  min_halt_reward_range: 0.05
  min_decision_margin: 0.0
  search_budget: 96
  max_depth: 4
  maintenance_scale: 0.0
  maintenance_ref_nodes: 30.0
  maintenance_exponent: 1.1
  time_lambda: 18.537
  time_p: 2.8
  time_tau: 2.5
  time_delta: 1
  timeout_value: -1.0
  time_mode: power_law
  samples_per_bucket: 2
  seed: 0
  clear: true

# ── Phase 2 ─────────────────────────────────────────────────────────────────
# stage: encoder pretrain (child-WDL, TINY)  ->  cts.data.build_tree
encoder:
  command: pretrain-child-wdl-encoder
  train_dir: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2200/train_manifest.json
  validation_dir: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2200/validation_manifest.json
  output_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2200/tiny_encoder.pt
  device: cuda
  k: 1
  d_embed: 32
  d_message: 32
  node_embed_hidden: 32
  n_heads: 2
  d_att: 16
  decoder_hidden: 32
  batch_size: 256
  learning_rate: 1.0e-3
  epochs: 6
  loss_type: huber
  huber_delta: 1.0
  num_workers: 0
  log_interval: 20

# stage: materialize root reps (frozen encoder -> z_t cache)  ->  cts.data.preprocess_mc.materialize
# Shared params only; the slurm loop injects per-split/-command paths via --set
# (output_dir, packed_data, final_cache, manifest_path, command, worker_index, num_workers).
materialize:
  encoder_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2200/tiny_encoder.pt
  device: cuda
  episode_batch_size: 8
  max_snapshots_per_shard: 250000
  hidden_dim: 256
  hidden_layers: 3

# ── Phase 3 ─────────────────────────────────────────────────────────────────
# stage: readout (MCHalt) training  ->  cts.train.controller_train
# MCHalt = frozen TINY encoder + ReLU advantage MLP, inputs [z_t, T_t]. Encoder
# arch fields MUST match tiny_encoder.pt (controller_train builds the encoder from
# these, then load_state_dict's the ckpt). Oracle cost fields match the mc_pack
# above (flattened per-bucket min/max + seed; extra="forbid").
train:
  metrics_run_name: sf_mchalt[elo2200]
  packed_train_data: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_packed/elo2200/train_manifest.json
  packed_validation_data: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_packed/elo2200/validation_manifest.json
  materialized_train_cache: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_materialized/elo2200/train_cache.pt
  materialized_validation_cache: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_materialized/elo2200/validation_cache.pt
  encoder_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2200/tiny_encoder.pt
  output_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2200/sf_mchalt_controller.pt
  device: cuda
  controller_inputs: ['z_t', 'T_t']
  k: 1
  node_embed_hidden: 32
  d_embed: 32
  d_message: 32
  n_heads: 2
  d_att: 16
  hidden_dim: 256
  hidden_layers: 3
  unfreeze_encoder: false
  separate_sign_head: false
  batch_size: 18000
  learning_rate: 1.0e-3
  weight_decay: 0.0
  sign_loss_weight: 0.1
  nontrivial_loss_weight: 1.0
  inverse_freq_weights: false
  epochs: 3
  validation_step_interval: 100
  greedy_eval_step_interval: 100
  metrics_log_interval: 20
  maintenance_scale: 0.0
  maintenance_ref_nodes: 30.0
  maintenance_exponent: 1.1
  time_lambda: 18.537
  time_p: 2.8
  time_tau: 2.5
  time_delta: 1
  timeout_value: -1.0
  samples_per_bucket: 2
  seed: 0
  scramble_min_time: 1
  scramble_max_time: 3
  medium_small_min_time: 4
  medium_small_max_time: 10
  medium_large_min_time: 11
  medium_large_max_time: 25
  large_min_time: 26
  large_max_time: 60
  very_large_min_time: 61
  very_large_max_time: 120

# ── Phase 4 ─────────────────────────────────────────────────────────────────
# stage: eval (4 halt models + per-rung results JSON)  ->  cts.analysis._budgeted.alt_models_eval
# Consumed as CLI flags by run_eval.sh (this entry point is argv-driven, not --config).
eval:
  packed_root: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_packed/elo2200
  materialized_validation_cache: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_materialized/elo2200/validation_cache.pt
  controller_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2200/sf_mchalt_controller.pt
  results_json: /home/hl4291/chess_analysis/figures/lmcos/sf_elo2200_results.json
  out_dir: /home/hl4291/chess_analysis/figures/lmcos
