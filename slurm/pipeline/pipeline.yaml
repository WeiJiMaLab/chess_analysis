# Pipeline DAG (single source of truth for step order + dependencies).
# `preprocess` is run on its own (`bash slurm/pipeline/preprocess.slurm`, builds the
# shared, run-independent personal.db) and is NOT submitted by submit_all.sh — steps
# that list it as a dependency just start immediately. submit_all.sh submits
# everything below in order, wiring `after` -> Slurm afterok on the parents' job ids.
#
#   preprocess ── filter_and_sample ─┬─ board_featurize[] ── (merge) ── board_analysis   (P0)
#                (filtered_moves +    ├─ gen_trees(puctvalue) ─┬─ engine_analysis_pwin     (P1, pwin) [DISABLED]
#                 tree-root FENs)     │                        ├─ engine_analysis_cp       (P1, cp)   [DISABLED]
#                                     │                        └─ argmax_filter ──
#                                     │                           pack_trees ── train_encoder ──
#                                     │                           pack_root ── train_readout_pg ── eval  (P3)
#
# filter_and_sample applies the ply window ONCE: it materializes the canonical
# filtered_moves table (board + engine read it) and samples the tree-root FENs from
# it. Captures/checks are a BOARD precondition (board_featurize array → merge →
# board_features), not part of preprocess. Trees are PUCT on win-probability value
# (puctvalue_md36, labnotebook 2026-07-07 — BeFS demoted to variants.befs), generated
# in full (100K, non-destructive — nothing is deleted). argmax_filter is a NON-
# destructive "thinking helps" filter that only gates the P3 (meta-controller) branch
# via split.include_list; engine_analysis_pwin/cp (P1) read the full, untouched
# gen_trees output directly. engine_analysis_pwin/cp are currently DISABLED (commented
# out in `steps:` below, plan.md §G item 4, 2026-07-08) -- P1 steps off the unfiltered
# corpus with no downstream dependents; the P3 model branch does not depend on either.
# Re-enable by uncommenting their entries below.
steps:
  # ---- filter: window the moves (canon) + sample the tree-root FENs ----
  - name: filter_and_sample
    script: filter_and_sample.slurm
    after: [preprocess]

  # ---- P0: board — featurize captures/checks (array) -> merge -> analyses ----
  - name: board_featurize
    script: board_featurize.slurm
    merge: board_merge.slurm       # afterok the array; board_analysis depends on THIS
    after: [filter_and_sample]
    array: 0-15

  - name: board_analysis
    script: board_analysis.slurm
    after: [board_featurize]

  # ---- trees ----
  - name: gen_trees
    script: gen_trees.slurm
    after: [filter_and_sample]
    array: 0-159             # 160 tasks x 2500 FENs = full 400k -> puctvalue_md36, kept in full
                              # (labnotebook 2026-07-07: 400K raw leaves ~100K argmax>2 survivors;
                              # non-destructive -- see argmax_filter below for the meta-controller-only filter)

  # ---- P1: engine stats, off the FULL (unfiltered) tree corpus ----
  # DISABLED (plan.md §G item 4, 2026-07-08): confirmed independent of the P3 model
  # branch (argmax_filter -> pack_trees -> train_encoder -> pack_root ->
  # train_readout_pg -> eval), which branches off gen_trees/argmax_filter directly.
  # Commented out, not deleted -- uncomment to re-enable.
  # - name: engine_analysis_pwin
  #   script: engine_analysis_pwin.slurm
  #   after: [gen_trees]
  #
  # - name: engine_analysis_cp
  #   script: engine_analysis_cp.slurm
  #   after: [gen_trees]

  # ---- "thinking helps" filter: non-destructive, keeps only trees where the true
  # oracle argmax stop step exceeds 2 (labnotebook 2026-07-07 -- SingleHalt* collapses
  # to a near-zero stop on the unfiltered population; this surfaces a genuine k*=7).
  # Only gates the P3 (meta-controller) branch via split.include_list, not P1 above. ----
  - name: argmax_filter
    script: argmax_filter.slurm
    after: [gen_trees]

  # ---- P3: model (encoder -> readout -> eval) ----
  - name: pack_trees
    script: pack_trees.slurm
    after: [argmax_filter]

  - name: train_encoder
    script: train_encoder.slurm
    after: [pack_trees]

  - name: pack_root
    script: pack_root.slurm        # materialize worker (array)
    merge: pack_root_merge.slurm   # afterok the array; downstream depends on THIS
    after: [train_encoder]
    array: 0-39                    # 40 materialize workers

  - name: train_readout_pg
    script: train_readout_pg.slurm
    after: [pack_root]

  - name: eval
    script: eval.slurm
    after: [train_readout_pg]

# ---- Auxiliary branch (NOT in the default DAG; run manually as a variant) ----
# Monotonicity / no-switchback FEN filter for training: compute a per-tree
# switchback count from the BeFS best-move trace, emit a keep-list, and re-run
# pack_trees --trace-filter to retrain the readout on monotone-only positions.
# Default OFF (after-the-fact retrain). Stub: slurm/pipeline/aux_trace_filter.slurm.
