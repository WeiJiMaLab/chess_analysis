# Pipeline DAG (single source of truth for step order + dependencies).
# `preprocess` is run on its own (`bash slurm/pipeline/preprocess.slurm`, builds
# personal.db) and is NOT submitted by submit_all.sh — steps that list it as a
# dependency just start immediately. submit_all.sh submits everything below in
# order, wiring `after` -> Slurm afterok on the parents' job ids.
#
#   preprocess ─┬─ featurize_board ── board_analysis          (P0: engine-free)
#               └─ filter_trees ── gen_trees(befs1cp) ─┬─ engine_analysis_pwin  (P1 stats, pwin)
#                                                      ├─ engine_analysis_cp    (P1 stats, cp)
#                                                      └─ pack_trees ── train_encoder ──
#                                                         pack_root ── train_readout_pg ── eval  (P3)
#
# Trees are built by greedy BeFS on native centipawns (key befs1cp_md36); both
# WDL and cp/mate are stored per node, so the engine step runs twice (UNIT=pwin,
# UNIT=cp) off the SAME trees. board_analysis depends on featurize_board (the
# P0 board-correlate battery reads its per-FEN parquet).
steps:
  # ---- P0: engine-free board battery ----
  - name: featurize_board
    script: featurize_board.slurm
    after: [preprocess]

  - name: board_analysis
    script: board_analysis.slurm
    after: [featurize_board]

  # ---- trees ----
  - name: filter_trees
    script: filter_trees.slurm
    after: [preprocess]

  - name: gen_trees
    script: gen_trees.slurm
    after: [filter_trees]
    array: 0-99            # 100 tasks x 2500 FENs = full 250k -> befs1cp_md36

  # ---- P1: engine stats, two value units off the same trees ----
  - name: engine_analysis_pwin
    script: engine_analysis_pwin.slurm
    after: [gen_trees]

  - name: engine_analysis_cp
    script: engine_analysis_cp.slurm
    after: [gen_trees]

  # ---- P3: model (encoder -> readout -> eval) ----
  - name: pack_trees
    script: pack_trees.slurm
    after: [gen_trees]

  - name: train_encoder
    script: train_encoder.slurm
    after: [pack_trees]

  - name: pack_root
    script: pack_root.slurm        # materialize worker (array)
    merge: pack_root_merge.slurm   # afterok the array; downstream depends on THIS
    after: [train_encoder]
    array: 0-39                    # 40 materialize workers

  - name: train_readout_pg
    script: train_readout_pg.slurm
    after: [pack_root]

  - name: eval
    script: eval.slurm
    after: [train_readout_pg]

# ---- Auxiliary branch (NOT in the default DAG; run manually as a variant) ----
# Monotonicity / no-switchback FEN filter for training: compute a per-tree
# switchback count from the BeFS best-move trace, emit a keep-list, and re-run
# pack_trees --trace-filter to retrain the readout on monotone-only positions.
# Default OFF (after-the-fact retrain). Stub: slurm/pipeline/aux_trace_filter.slurm.
