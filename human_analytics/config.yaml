# =============================================================================
# Cache and Tree Defaults (Stockfish Elo 2000 — parity with the lmcos_tiny pipeline)
# Re-pointed from lc0 human_trees to the SF-2000 ladder trees so the engine-vs-RT
# analysis (GSS/Gain/MQ/action-gap/H(π)) runs on the SAME trees the halt-model
# pipeline trains/evals on. Fewer trees (50k SF roots vs ~199K lc0). NOTE: the SF
# "prior" feature is exactly UNIFORM (verified min==max==1/n_kids) — no real policy
# head — so H(pi) collapses to log(#legal moves), NOT a policy-uncertainty signal.
# GSS / Gain / MQ / action-gap come from the VALUE search and remain valid.
# lc0 reproducibility: pass --trees-dir /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/data/human_trees
#   --key human_trees_200000_7  (or temporarily revert the two values below).
# =============================================================================
trees_default: "/scratch/gpfs/GRIFFITHS/hl4291/sf_trees/elo2000"
cache_default: "/scratch/gpfs/GRIFFITHS/hl4291/tree_values_cache"
key_default: "elo2000_100000_7"   # = basename(trees_default)_<n_trees default>_<seed default>; what tree_values writes

# =============================================================================
# Response Time (RT) Plotting & Analysis Configurations
# =============================================================================
# Number of bins used for SQL-side response time histogram binning
response_time_histogram_bins: 50

# Number of quantile probe points used for the normal Q-Q plot
qq_plot_quantile_probes: 200

# =============================================================================
# DuckDB Database and Table Configurations
# =============================================================================
selected_db_default: "/scratch/gpfs/GRIFFITHS/hl4291/personal.db"
table_moves: "moves"
table_processed_moves: "processed_moves"
table_processed_moves_nonzero: "processed_moves_nonzero"
