# Phase 2 Agent 6 (ysagiv human_trees, xaba branch, e2e/joint-encoder continuation). NEW,
# ADDITIVE config -- does NOT touch config_minply15_maxply75.yaml, config_ysagiv_xaba.yaml
# (Agent 1's, COMPLETE, owned by ysagiv_trees.md), or Agent 4/5's regime-sweep / capacity-sweep
# scratch dirs. Question this config's chain answers: does e2e (joint encoder+head) training,
# the ONLY lever anywhere in this investigation that beat SingleHalt* even once on our OWN
# corpus (our_trees_continued.md, sub-line A), improve on Agent 1's already-strong FROZEN-encoder
# z_t result on the ysagiv xaba-filtered population (ysagiv_trees.md's best result: z_t
# significantly beats both SingleHalt* and Stats at lambda=0.0005, m=0)?
#
# Data reuse (READ-ONLY): `mc_packed_dir` and the `tiny_encoder.pt` init checkpoint both point
# straight at Agent 1's already-packed/trained `ysagiv_xaba` scratch dir -- nothing here
# regenerates trees, re-splits, re-filters, or re-packs. This config's OWN outputs (e2e
# checkpoints, its own materialized cache, figures) all live under a fresh
# `ysagiv_xaba_e2e` scratch subdir / `ysagiv/xaba_e2e` figures subdir, never colliding with
# Agent 1's `ysagiv_xaba` or Agent 4/5's `ysagiv_xaba_{regime_sweep,wide,deep}`-style dirs.
#
# Only `train`/`materialize`/`eval` sections are needed (mirrors config_ysagiv_xaba.yaml's own
# comment: no filter_and_sample/board/gen_trees/split/gnn_pack/mc_pack stage runs here).
globals:
  run_name: ysagiv_xaba_e2e
  scratch_dir: /scratch/gpfs/GRIFFITHS/hl4291/lmcos
  outputs_dir: /home/hl4291/chess_analysis/outputs/figures
  search_budget: 96
  run_dir: ${scratch_dir}/${run_name}
  # READ-ONLY reuse of Agent 1's already-packed/trained ysagiv_xaba outputs -- never written to
  # by anything in this config's chain.
  agent1_packed_dir: /scratch/gpfs/GRIFFITHS/hl4291/lmcos/ysagiv_xaba/packed
  mc_packed_dir: /scratch/gpfs/GRIFFITHS/hl4291/lmcos/ysagiv_xaba/mc_packed
  # This agent's OWN scratch, isolated from Agent 1/4/5.
  materialized_dir: ${run_dir}/materialized
  checkpoints_dir: ${run_dir}/e2e_checkpoints
  config_dir: ${run_dir}/pack_configs
  log_dir: ${run_dir}/pack_logs
  figures_dir: ${outputs_dir}/ysagiv/xaba_e2e

# analysis.evaluate imports analysis.utils.helpers, which unconditionally reads a
# `human_analysis` section at MODULE IMPORT TIME (db_connection()'s default arg reads
# CONFIG["selected_db_default"] at def-time) -- same footgun documented in
# config_ysagiv_xaba.yaml. Points at the same shared, read-only personal.db; never opened by
# anything in this chain.
human_analysis:
  selected_db_default: ${scratch_dir}/personal.db

# slurm/helpers/setup_env.sh unconditionally queries `encoder.output_checkpoint` (ENC env var)
# regardless of which stages this config's chain actually runs. Stub only -- never
# read/written by anything in this config's train/materialize/eval chain (no
# pretrain-child-wdl-encoder stage runs here; the real encoder init is `train.encoder_checkpoint`
# above, read-only from Agent 1's tiny_encoder.pt).
encoder:
  output_checkpoint: ${agent1_packed_dir}/tiny_encoder.pt

train:
  metrics_run_name: mchalt_ysagiv_xaba_e2e
  # READ-ONLY: Agent 1's already-packed mc-training data (never regenerated here).
  packed_train_data: ${mc_packed_dir}/train_manifest.json
  packed_validation_data: ${mc_packed_dir}/validation_manifest.json
  materialized_train_cache: ${materialized_dir}/train_cache.pt
  materialized_validation_cache: ${materialized_dir}/validation_cache.pt
  # INIT point: Agent 1's frozen, trained child-WDL encoder (tiny_encoder.pt). e2e training
  # unfreezes it and continues training jointly with a fresh head against the real PG
  # expected-regret objective -- same recipe as our_trees_continued.md sub-line A.
  encoder_checkpoint: ${agent1_packed_dir}/tiny_encoder.pt
  # THIS agent's own output -- never the production/Agent-1 checkpoint.
  output_checkpoint: ${checkpoints_dir}/e2e_controller.pt
  resume_checkpoint: null   # set via --set resume_checkpoint=... when chaining epoch 2+
  device: cuda
  controller_inputs: ['z_t', 'T_t']
  k: 1
  node_embed_hidden: 32
  d_embed: 32
  d_message: 32
  n_heads: 2
  d_att: 16
  hidden_dim: 32
  hidden_layers: 2
  unfreeze_encoder: true
  separate_sign_head: false
  batch_size: 18000
  episode_batch_size: 8
  learning_rate: 3.0e-4
  stop_temperature: 4.0
  stop_temperature_final: 1.0
  weight_decay: 0.0
  sign_loss_weight: 0.1
  sign_pos_weight: 1.0
  nontrivial_loss_weight: 1.0
  inverse_freq_weights: false
  epochs: 1
  pg_max_episodes: 15000   # same 1h-under-gpu-test cap Agent 2 used for chained 1-epoch e2e steps
  validation_step_interval: 100
  greedy_eval_step_interval: 100
  metrics_log_interval: 20
  maintenance_scale: 0.0
  maintenance_ref_nodes: 30.0
  maintenance_exponent: 1.0
  time_lambda: 0.01
  time_mode: linear
  time_p: 2.8
  time_tau: 2.5
  time_delta: 1
  timeout_value: -1.0
  samples_per_bucket: 2
  fixed_budget: 96
  seed: 0

materialize:
  # Placeholder default; the real per-step e2e-trained encoder path is passed explicitly via
  # --set encoder_checkpoint=... at each materialize call (mirrors
  # slurm/agent2_e2e_continue_materialize_and_eval.slurm's pattern).
  encoder_checkpoint: ${agent1_packed_dir}/tiny_encoder.pt
  device: cuda
  episode_batch_size: 8
  max_snapshots_per_shard: 250000
  hidden_dim: 32
  hidden_layers: 2

eval:
  packed_root: ${mc_packed_dir}
  materialized_validation_cache: ${materialized_dir}/validation_cache.pt
  controller_checkpoint: ${checkpoints_dir}/e2e_controller.pt
  results_json: ${figures_dir}/results.json
  out_dir: ${figures_dir}
  time_mode: linear
  time_lambda: 0.01
  maintenance_scale: 0.0
  maintenance_exponent: 1.0
  maint_lambda: 0.01
  max_episodes: 15000
