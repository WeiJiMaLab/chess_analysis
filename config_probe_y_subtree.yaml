# External-expert probe Y (plan.md "External expert input (Yotam Sagiv...)" section,
# 2026-07-08): apples-to-apples eval of Yotam Sagiv's subtree-size-weighted encoder
# (`tree_encoder_child_wdl_async_k1_subtree_weighted.pt`, pretrained with edge
# cross-entropy weighted by child subtree size) under THIS investigation's current,
# calibrated methodology (analysis.evaluate's `_fit_stop_controllers`/
# `_compute_frontier_data` pattern, paired-bootstrap significance via cts.stats.bootstrap_ci).
#
# NEW, additive config -- does NOT touch config_minply15_maxply75.yaml, config_ysagiv_argmax.yaml,
# or any file Agent 1 owns. `mc_packed_dir` points READ-ONLY at Agent 1's already-built,
# stable argmax>2-filtered `human_trees` mc_packed directory (built by their
# split -> mc_pack pipeline; reused here rather than re-derived, per plan.md's "reuse if
# stable/complete" instruction) -- this run never runs split/gnn_pack/mc_pack itself and
# never writes into `ysagiv_argmax/`. Every path THIS config writes to lives under
# hl4291's own scratch (`probe_y_subtree_weighted/`), never under
# `/scratch/gpfs/GRIFFITHS/ysagiv/` (read-only source, owned by someone else) and never
# under Agent 1's `ysagiv_argmax/` output tree.
#
# Only `materialize` + `eval` sections are needed: the mc_packed episodes already exist
# (Agent 1's pipeline), and we load the EXISTING pretrained subtree-weighted encoder
# checkpoint rather than pretraining a new one.
globals:
  run_name: probe_y_subtree_weighted
  scratch_dir: /scratch/gpfs/GRIFFITHS/hl4291/lmcos
  outputs_dir: /home/hl4291/chess_analysis/outputs/figures
  run_dir: ${scratch_dir}/${run_name}
  mc_packed_dir: /scratch/gpfs/GRIFFITHS/hl4291/lmcos/ysagiv_argmax/mc_packed   # Agent 1's, READ-ONLY reuse
  materialized_dir: ${run_dir}/materialized                                     # ours, new
  log_dir: ${run_dir}/pack_logs
  config_dir: ${run_dir}/pack_configs   # unused by this probe's own code; only exists because
                                          # slurm/helpers/setup_env.sh (shared) unconditionally
                                          # queries globals.config_dir and mkdir -p's it.
  figures_dir: /home/hl4291/chess_analysis/outputs/figures/minply15_maxply75/diagnosis

# Stub -- unused by this probe (we load an EXISTING pretrained checkpoint, never pretrain a
# new one), but slurm/helpers/setup_env.sh (shared across every pipeline config) unconditionally
# queries encoder.output_checkpoint. Points at the same read-only subtree-weighted checkpoint
# materialize.encoder_checkpoint below uses, so the value is at least meaningful if ever read.
encoder:
  output_checkpoint: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/checkpoints/tree_encoder_child_wdl_async_k1_subtree_weighted.pt

materialize:
  # Yotam Sagiv's pretrained encoder checkpoint -- READ-ONLY source, confirmed on disk
  # (labnotebook.md "Encoder pretrain" section, 2026-05-20 subtree-size-weighted pretraining).
  # Architecture (k=1, d_embed=128, d_message=128, n_heads=4, d_att=32, node_embed_hidden=128,
  # node_feat=5) is read straight out of the checkpoint's own metadata by
  # `load_encoder_architecture` -- NOT assumed to match our production encoder's d_embed=32.
  encoder_checkpoint: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/checkpoints/tree_encoder_child_wdl_async_k1_subtree_weighted.pt
  device: cpu
  episode_batch_size: 8
  max_snapshots_per_shard: 250000
  hidden_dim: 32      # advantage-head shape is irrelevant here -- only the frozen encoder's
  hidden_layers: 2     # z_t output is consumed; the head's random weights are discarded.

# Minimal stub -- required only because `analysis.utils.helpers` (imported transitively by
# `analysis.evaluate`) eagerly runs `load_config_section("human_analysis")` at import time
# against whatever config is active, and raises KeyError if the section is missing (found
# 2026-07-08 investigating a sibling agent's crash on the same class of new, additive
# config file). None of this probe's own code reads any field from this section -- it
# exists solely so the import doesn't blow up.
human_analysis:
  figures_dir: ${outputs_dir}/probe_y_subtree_weighted
  # `helpers.db_connection`'s default arg is evaluated at MODULE IMPORT time (not call time),
  # so this key must resolve even though this probe never touches DuckDB. Points at the same
  # shared personal.db every other config uses -- never opened by this probe's own code.
  selected_db_default: ${scratch_dir}/personal.db

eval:
  packed_root: ${mc_packed_dir}
  materialized_validation_cache: ${materialized_dir}/validation_cache.pt
  out_dir: ${figures_dir}
  # Primary regime: REGIME's confirmed meaningful point on OUR OWN corpus (k*=10,
  # k_frac=0.105, meaningful=True per regime_select_results.json) -- sanity-checked
  # directly on THIS population by evaluate_probe_y.py itself (prints fit_singlehalt_stop's
  # k on the human_trees argmax-filtered fit split; a degenerate k (0 or ceiling) would flag
  # that this regime doesn't transfer, per plan.md's instruction not to assume it does).
  time_mode: linear
  time_lambda: 0.01
  maintenance_scale: 0.0
  maintenance_exponent: 1.0
  max_episodes: 15000
  d_embed: 128
