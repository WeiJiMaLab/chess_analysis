# pipeline.yaml — THE single config for the full-scale GNN/MC roundtrip.
# Replaces 12 scattered per-stage YAMLs. One section per stage; run top-to-bottom.
# Narrative lineage + provenance: mc_pipeline.md. Fast iteration loop: minimal_mc.py + minimal_mc.yaml.
#
# NOTE on instance vs forward-config: the CURRENT artifact controller_filtered.pt was produced
# with min_halt_reward_range=0.05 and RAW (unnormalized) scalar features — it is DIAGNOSED BROKEN
# (loses to Fraction-f*; see mc_pipeline.md §10 + mc_minimal_plan.md). The values below are the
# YSAGIV-FAITHFUL FORWARD config: halt-range 0.1; the z-score feature fix is intrinsic to mc.py;
# Phase 2 may switch controller SELECTION to regret-direct (mc_minimal_plan.md §4).

run_name: filtered_v1
seed: 0
env:
  venv: /home/hl4291/venv
  pythonpath: /home/hl4291/chess_analysis/lmcos/src
  scratch: /scratch/gpfs/GRIFFITHS/hl4291

# 1-2. SOURCE + TREE FILTER — cts.data.filter_trees_by_trace
filter:
  trees_dir: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/data/human_trees
  output_dir: ${env.scratch}/filtered          # -> clean_trees.txt (101,812 / 15.9%)
  n_workers: 72
  min_steps: 3
  criterion: INTERSECTION(puct_stable, monotone)
  # puct_stable: bmi[0]!=final AND bmi[len//2]!=final   (search materially changes the move)
  # monotone:    all(bmi[argmax(bmi==final):] == final) (once found, never abandoned)

# 3. SPLIT — partition/make_partition.py
split:
  ratio: 0.5
  seed: 0
  # filtered split = clean_trees ∩ partition -> 50,674 train / 51,138 test
  out: ${env.scratch}/packed/split_filtered/{train,validation}_manifest.txt

# 4. GNN PACK — cts.data.preprocess_gnn.pack  (SLURM array, 20 chunks)
gnn_pack:
  split_root: ${env.scratch}/packed/split_filtered
  output_root: ${env.scratch}/packed/gnn
  shard_size: 2000

# 5. ENCODER PRETRAIN — cts.data.build_tree pretrain-child-wdl-encoder
encoder:
  objective: search_consolidated_edge_wdl_v1   # per-edge child-WDL cross-entropy
  loss_weight_by_subtree_size: true
  k: 1
  d_embed: 128
  d_message: 128
  n_heads: 4
  d_att: 32
  node_embed_hidden: 128
  decoder_hidden: 128
  epochs: 45
  batch_size: 128
  learning_rate: 1.0e-3
  weight_decay: 0.0
  output_checkpoint: ${env.scratch}/GNN/encoder_best.pt   # selected by val loss

# 6. MC EPISODE PACK — cts.data.preprocess_mc.pack  (budgeted oracle; SLURM array, 20 chunks)
mc_pack:
  split_root: ${env.scratch}/packed/split_filtered
  output_root: ${env.scratch}/packed/mc
  shard_size: 2000
  min_halt_reward_range: 0.1     # ysagiv (broken instance used 0.05)
  min_decision_margin: 0.0       # ysagiv (NOT enabled)
  oracle:
    oracle_type: budgeted_controller_v1
    reward_scale: 1.0
    timeout_value: -1.0
    time_lambda: 18.537          # time-cost scale
    time_p: 2.8
    time_tau: 2.5
    time_delta: 1
    maintenance_scale: 0.0       # maintenance cost DISABLED
    maintenance_ref_nodes: 30.0
    maintenance_exponent: 1.1
    samples_per_bucket: 2
    budget_buckets:
      - {name: scramble,     min_time: 1,  max_time: 3}
      - {name: medium-small, min_time: 4,  max_time: 10}
      - {name: medium-large, min_time: 11, max_time: 25}
      - {name: large,        min_time: 26, max_time: 60}
      - {name: very-large,   min_time: 61, max_time: 120}

# 7. MATERIALIZE — cts.data.preprocess_mc.materialize (frozen encoder -> z_root; GPU array, 16 workers/split)
materialize:
  encoder_checkpoint: ${env.scratch}/GNN/encoder_best.pt
  episode_batch_size: 8
  max_snapshots_per_shard: 250000
  # cache row layout = [z_t(128), N_t, T_t] -> materialized/{train,validation}_cache.pt

# 8. CONTROLLER TRAIN — cts.train.controller_train
controller:
  controller_inputs: [z_t, T_t]          # uses root embedding + remaining budget; drops N_t
  hidden_dim: 256
  hidden_layers: 3
  unfreeze_encoder: false
  feature_normalization: zscore          # mc.py _select_features: N_t~(1116,935), T_t~(35,28)
  target: continue_value - halt_value    # oracle POST-DP advantage (oracle.py)
  loss: advantage_mse + sign_loss_weight * sign_bce
  sign_loss_weight: 0.1
  separate_sign_head: false
  epochs: 3
  batch_size: 18000
  episode_batch_size: 4
  learning_rate: 1.0e-3
  select_by: average_regret              # checkpoint selection criterion
  decision_rule: stop at first predicted advantage <= 0   # FIXED threshold (Phase 2: tune on regret)
  output_checkpoint: ${env.scratch}/GNN/controller_filtered.pt

# 9. EVAL — cts.analysis._budgeted.alt_models_eval
eval:
  metric: regret = oracle_value - return_for_stop_step      # + P(stop == OSS)
  models: [Always-Stop, Never-Stop, "Fraction-of-Budget(f* fit on train regret)", GNN/MC]
  out: figures/{regret,stop_eq_oss}_by_model.png
