[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cts"
version = "0.1.0"
description = "Compute Tree Search meta-controller research code."
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"cts" = "src"}
packages = [
  "cts",
  "cts.analysis",
  "cts.analysis._budgeted",
  "cts.core",
  "cts.core.providers",
  "cts.data",
  "cts.data.preprocess_gnn",
  "cts.data.preprocess_mc",
  "cts.models",
  "cts.train",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
