# P2 Stockfish strength ladder — rung 1800.
# Shared root FENs (2023 human games); only sf_elo differs across rungs so the
# ladder isolates teacher strength. Edge child-WDL targets are emitted as in lc0.
command: generate-dataset
provider: stockfish

engine_path: /home/hl4291/stockfish/src/stockfish

fens: /scratch/gpfs/GRIFFITHS/hl4291/sf_ladder_roots.txt  # PRE-SAMPLED 4-field FEN subset (NOT the 5.4GB fens.txt: _load_fens reads the whole file into RAM)
output_dir: /scratch/gpfs/GRIFFITHS/hl4291/sf_trees/elo1800

# Match the human_trees search shape (depth 4, 96-node PUCT budget).
search_budget: 96
min_nodes: 96
max_nodes: 96
max_depth: 4

# Stockfish provider knobs.
sf_elo: 1800
sf_search_limit_nodes: 100

seed: 42
resume: true
log_interval: 50
