# Reunification tree-gen — 150K human FENs from fens.txt (ground truth pool),
# FAITHFUL ysagiv replication regime: max_depth=10 (verified = ysagiv's cap; max
# over all 39,668 reference trees is 10, realized depth ~6), budget 96, multipv 8,
# lc0 cuda, net t1-256x10. edge_wdl_targets ARE emitted (build_tree.py passes
# include_edge_wdl_targets=True) so the child-WDL encoder objective is supervised
# (matching ysagiv). Array tasks override start/end index. Trees + sample +
# manifest live in output_dir. Submit on qos=gpu-short (NOT --partition).
command: generate-dataset

engine_path: /scratch/gpfs/GRIFFITHS/ysagiv/tools/lc0/build/release/lc0
weights_path: /scratch/gpfs/GRIFFITHS/ysagiv/chess/weights/t1-256x10-distilled-swa-2432500.pb.gz

fens: /scratch/gpfs/GRIFFITHS/hl4291/lc0_trees/fens_sample_150k.txt
output_dir: /scratch/gpfs/GRIFFITHS/hl4291/lc0_trees

search_budget: 96
min_nodes: 96
max_nodes: 96

seed: 42
multipv: 8
max_depth: 10
resume: true
log_interval: 25

backend: cuda
start_index: 0
end_index: 150000
