# U1.1 reunification — 50K human FENs, GPU lane (Lc0 cuda).
# Indices are overridden per array task; this file is the shared base.
# Output is keyed by global FEN index, so the GPU lane [0,14000) and the CPU
# lane [14000,50000) write disjoint files into one human_trees_50k/ dir.
command: generate-dataset

engine_path: /scratch/gpfs/GRIFFITHS/ysagiv/tools/lc0/build/release/lc0
weights_path: /scratch/gpfs/GRIFFITHS/ysagiv/chess/weights/t1-256x10-distilled-swa-2432500.pb.gz

fens: /scratch/gpfs/GRIFFITHS/hl4291/tmp/human_fens_50k.txt
output_dir: /scratch/gpfs/GRIFFITHS/hl4291/tmp/human_trees_50k

search_budget: 96
min_nodes: 96
max_nodes: 96

seed: 42
multipv: 8
max_depth: 4
resume: true
log_interval: 10

backend: cuda
start_index: 0
end_index: 14000
