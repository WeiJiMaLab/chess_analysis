# FractionHalt = MCHalt's protocol, budget-only input. IDENTICAL to the recorded
# MCHalt run (controller_filtered) in every field EXCEPT controller_inputs ([T_t],
# drops z_t), output_checkpoint, and metrics_run_name. Same data, encoder, loss,
# decision rule, regret-based checkpoint selection.
#
# NOTE: oracle config is FLATTENED into per-bucket min/max fields + `seed`
# (ControllerTrainConfig has extra="forbid"; oracle_type/budget_seed/budget_buckets
# are metadata-only output keys, NOT input fields — controller_train.py:52-53,
# 109-118, 1083-1104).
metrics_run_name: budgetonly[budget]
packed_train_data: /scratch/gpfs/GRIFFITHS/hl4291/packed/mc/train_manifest.json
packed_validation_data: /scratch/gpfs/GRIFFITHS/hl4291/packed/mc/validation_manifest.json
materialized_train_cache: /scratch/gpfs/GRIFFITHS/hl4291/packed/materialized/train_cache.pt
materialized_validation_cache: /scratch/gpfs/GRIFFITHS/hl4291/packed/materialized/validation_cache.pt
encoder_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/GNN/encoder_best.pt
output_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/GNN/controller_budgetonly.pt
device: cuda

# THE ONLY MODELLING CHANGE vs MCHalt:
controller_inputs: ['T_t']

# encoder arch (matches encoder_best.pt) + head + loss = identical to MCHalt
k: 1
node_embed_hidden: 128
d_embed: 128
d_message: 128
n_heads: 4
d_att: 32
hidden_dim: 256
hidden_layers: 3
unfreeze_encoder: false
separate_sign_head: false
batch_size: 18000
learning_rate: 1.0e-3
weight_decay: 0.0
sign_loss_weight: 0.1
nontrivial_loss_weight: 1.0
inverse_freq_weights: false
epochs: 3
validation_step_interval: 100
greedy_eval_step_interval: 100
metrics_log_interval: 20

# oracle (identical to recorded MCHalt run) — flattened fields
maintenance_scale: 0.0
maintenance_ref_nodes: 30.0
maintenance_exponent: 1.1
time_lambda: 18.537
time_p: 2.8
time_tau: 2.5
time_delta: 1
timeout_value: -1.0
samples_per_bucket: 2
seed: 0
scramble_min_time: 1
scramble_max_time: 3
medium_small_min_time: 4
medium_small_max_time: 10
medium_large_min_time: 11
medium_large_max_time: 25
large_min_time: 26
large_max_time: 60
very_large_min_time: 61
very_large_max_time: 120
