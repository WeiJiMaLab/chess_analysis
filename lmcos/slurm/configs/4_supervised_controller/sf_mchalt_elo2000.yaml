# SF ladder MCHalt controller, rung elo2000.
# MCHalt = frozen TINY encoder + ReLU advantage MLP, inputs [z_t, T_t].
# Mirrors controller_budgetonly.yaml EXACTLY except:
#   - controller_inputs: ['z_t','T_t']  (MCHalt; budgetonly drops z_t)
#   - encoder arch = TINY (k=1, d_embed=32, ...) to match sf_packed/.../tiny_encoder.pt
#     (controller_train.py:1942-1956 builds the encoder from these config fields,
#      then load_state_dict's the checkpoint into it — arch MUST match the ckpt).
#   - data/encoder/output paths point at the SF rung's artifacts.
# Oracle cost fields copied from controller_budgetonly.yaml; verified identical to
# the SF MC-pack manifest's flattened oracle (time_lambda=18.537, ..., 5 std buckets).
# NOTE: oracle config is FLATTENED into per-bucket min/max + `seed` (extra="forbid";
# oracle_type/budget_seed/budget_buckets are output-only metadata, NOT input fields).
metrics_run_name: sf_mchalt[elo2000]
packed_train_data: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_packed/elo2000/train_manifest.json
packed_validation_data: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_packed/elo2000/validation_manifest.json
materialized_train_cache: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_materialized/elo2000/train_cache.pt
materialized_validation_cache: /scratch/gpfs/GRIFFITHS/hl4291/sf_mc_materialized/elo2000/validation_cache.pt
encoder_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2000/tiny_encoder.pt
output_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/sf_packed/elo2000/sf_mchalt_controller.pt
device: cuda

# MCHalt input set:
controller_inputs: ['z_t','T_t']

# encoder arch (matches sf_packed/elo2000/tiny_encoder.pt) + head + loss
k: 1
node_embed_hidden: 32
d_embed: 32
d_message: 32
n_heads: 2
d_att: 16
hidden_dim: 256
hidden_layers: 3
unfreeze_encoder: false
separate_sign_head: false
batch_size: 18000
learning_rate: 1.0e-3
weight_decay: 0.0
sign_loss_weight: 0.1
nontrivial_loss_weight: 1.0
inverse_freq_weights: false
epochs: 3
validation_step_interval: 100
greedy_eval_step_interval: 100
metrics_log_interval: 20

# oracle (canonical cost model; matches SF MC pack) — flattened fields
maintenance_scale: 0.0
maintenance_ref_nodes: 30.0
maintenance_exponent: 1.1
time_lambda: 18.537
time_p: 2.8
time_tau: 2.5
time_delta: 1
timeout_value: -1.0
samples_per_bucket: 2
seed: 0
scramble_min_time: 1
scramble_max_time: 3
medium_small_min_time: 4
medium_small_max_time: 10
medium_large_min_time: 11
medium_large_max_time: 25
large_min_time: 26
large_max_time: 60
very_large_min_time: 61
very_large_max_time: 120
