# Full node targets encoder pretrain on pretrain_packed_50k_nodetargets_full (Huber + NodeTargetsHead).
# Entry: python3 -m cts.data.build_tree --config configs/data/hl4291_pretrain_nodetargets_50k.yaml
# Slurm: export CONFIG=.../hl4291_pretrain_nodetargets_50k.yaml && sbatch hl4291_slurm/3_pretrain_nodetargets.slurm
#
# Startup loads all packed shards into RAM (~15–20 min). Resume: *_resume.pt beside output_checkpoint.
# Outputs: tree_encoder_nodetargets_50k.pt (5-wide encoder) + tree_encoder_nodetargets_50k_nodetargets_head.pt
command: pretrain-nodetargets-encoder
train_dir: /scratch/gpfs/GRIFFITHS/hl4291/chess/CTS/data/pretrain_packed_50k_nodetargets_full/train_manifest.json
validation_dir: /scratch/gpfs/GRIFFITHS/hl4291/chess/CTS/data/pretrain_packed_50k_nodetargets_full/validation_manifest.json
output_checkpoint: /scratch/gpfs/GRIFFITHS/hl4291/chess/CTS/checkpoints/tree_encoder_nodetargets_50k.pt
device: cuda
k: 1
d_embed: 128
d_message: 128
n_heads: 4
d_att: 32
node_embed_hidden: 128
decoder_hidden: 128
batch_size: 8
learning_rate: 0.001
weight_decay: 0.0
epochs: 20
num_workers: 0
pin_memory: true
log_interval: 25
loss_type: huber
huber_delta: 1.0
