command: pretrain-child-wdl-encoder

# Same packed data the rerun encoder was pretrained on (assumes the v2 repack
# blocked on the rewrite_compact bug has been resolved — if not, this stays
# pointed at a path that doesn't yet exist).
train_dir: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/data/pretrain_packed_oracle96_trace_filtered_rerun/train_manifest.json
validation_dir: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/data/pretrain_packed_oracle96_trace_filtered_rerun/validation_manifest.json

# Fresh-from-init pretraining; produces a new encoder distinct from the rerun one.
output_checkpoint: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/checkpoints/tree_encoder_child_wdl_async_k1_bucketed.pt

device: cuda

# Encoder architecture: matches the rerun encoder so the per-bucket trajectory
# is directly interpretable against the existing audit (async k=1, d_embed=128).
k: 1
node_embed_hidden: 128
d_embed: 128
d_message: 128
n_heads: 4
d_att: 32
decoder_hidden: 128

batch_size: 128
learning_rate: 1.0e-3
weight_decay: 0.0
epochs: 1000  # rerun ran 200; bumping to 1000 to see if any bucket is
              # still moving past the rerun's stopping point. Resume
              # checkpoint handles walltime; at ~1.1 min/epoch this is
              # ~18h, under the 24h slurm default.

num_workers: 0  # PackedTensorizedShardDataset is fully in-memory; workers
                # would inherit the full _examples list via /dev/shm fds and
                # hit "Cannot allocate memory" before training starts.
                # Per-batch CPU work is negligible (just slicing tensors).
prefetch_factor: 2
pin_memory: false
disable_persistent_workers: false

log_interval: 100

# Per-validation-epoch bucketed KL → JSONL time series.
log_bucketed_kl_path: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/checkpoints/tree_encoder_child_wdl_async_k1_bucketed_kl.jsonl
bucket_max_depth_bin: 12
bucket_subtree_size_log_max: 10
