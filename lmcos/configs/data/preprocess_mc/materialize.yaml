command: materialize

# Required for materialize.
packed_data: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/data/controller_packed_combined_nomaint_no_xaba/train_manifest.json
encoder_checkpoint: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/checkpoints/tree_encoder_child_wdl_async_k1.pt
output_dir: /scratch/gpfs/GRIFFITHS/ysagiv/chess/CTS/data/materialized_cache
worker_index: 0
num_workers: 1

# Runtime knobs.
device: cuda
episode_batch_size: 8
max_snapshots_per_shard: 250000
log_interval: 100

# Advantage-head architecture (encoder arch is read from the checkpoint).
hidden_dim: 256
hidden_layers: 3
