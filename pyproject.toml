[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Same import name (`cts`) as the parent so the forked modules read byte-identically.
# src-layout with two top-level packages under src/: `cts` (pipeline) and `analysis`
# (cts analysis scripts + human-RT analysis). Everything imports as `cts.___` /
# `analysis.___`, so one PYTHONPATH entry (src) covers both. Runtime deps come from
# the shared venv (torch, numpy, matplotlib, pydantic, pyyaml, python-chess).
name = "cts-tiny"
version = "0.1.0"
description = "Self-contained extract of the lmcos Stockfish mini-GNN / mini-MC halt-model pipeline."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["analysis.tests*"]


