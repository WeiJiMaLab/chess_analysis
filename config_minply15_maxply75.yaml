globals:
  # --- run identity + shared (config-independent) inputs ---
  run_name: minply15_maxply75          # THE key: every output root is namespaced by this
  min_ply: 15                          # analysis/gen ply window (Russek et al. 15-75)
  max_ply: 75
  scratch_dir: /scratch/gpfs/GRIFFITHS/hl4291/lmcos   # shared root
  outputs_dir: /home/hl4291/chess_analysis/outputs/figures
  fens_pool: ${scratch_dir}/fens.txt                  # shared raw FEN pool (all plies)
  search_budget: 64
  # --- per-run scratch tree (isolated; a new run_name never clobbers another) ---
  run_dir: ${scratch_dir}/${run_name}
  fens_sample: ${run_dir}/fens_sample.txt             # filter_trees output (in-window FENs)
  trees_dir: ${run_dir}/trees
  split_dir: ${run_dir}/split
  packed_dir: ${run_dir}/packed
  mc_packed_dir: ${run_dir}/mc_packed
  materialized_dir: ${run_dir}/materialized
  config_dir: ${run_dir}/pack_configs
  log_dir: ${run_dir}/pack_logs
  figures_dir: ${outputs_dir}/${run_name}/normative

human_analysis:
  figures_dir: ${outputs_dir}/${run_name}
  min_ply: ${min_ply}
  max_ply: ${max_ply}
  trees_default: ${trees_dir}/puctvalue_md36  # gen_trees.slurm writes HERE (overrides treegen.output_dir
  # to this field, not the other way around) -- must track the live selection algorithm or split/mc_pack
  # silently point at an empty/stale directory. Flipped alongside treegen.selection: puct (labnotebook 2026-07-07).
  cache_default: ${run_dir}/tree_values_cache
  response_time_histogram_bins: 50
  qq_plot_quantile_probes: 200
  selected_db_default: ${scratch_dir}/personal.db     # shared, preprocessed once
  table_moves: moves
  table_processed_moves: processed_moves
  table_processed_moves_nonzero: processed_moves_nonzero
  # run-specific canonical tables (namespaced: personal.db is shared across runs)
  table_filtered: filtered_moves_${run_name}          # filter stage → the windowed canon
  table_board_features: board_features_${run_name}     # board --featurize/--merge → captures/checks
  fens_sample: ${fens_sample}                          # tree-root FEN sample (treegen input)
  tree_fens_n: 400000                                  # # distinct FENs sampled for tree generation
  # 250k->400k (labnotebook 2026-07-07): generate everything (non-destructive), no inline filtering --
  # argmax>2 "thinking helps" yield is ~24.7% (900-FEN pilot), so 400K raw leaves ~100K survivors,
  # which is plenty. argmax_filter (pipeline.yaml) non-destructively picks that subset for pack_trees
  # via split.include_list, while engine_analysis_pwin/cp still see the FULL undeleted 400K.
  tree_fens_seed: 42

# Data preprocessing (builds the shared personal.db that every run reads).
# Run-independent, but kept here so preprocess.py reads its paths/params from the
# same config as analysis — personal_db is UNIFIED with selected_db_default above.
preprocess:
  personal_db: ${scratch_dir}/personal.db
  work_dir: ${scratch_dir}/tmp
  staging_dir: ${scratch_dir}/tmp/ld_moves_shard
  lichess_db: /scratch/gpfs/GRIFFITHS/chess-db/lichess.db
  moves_root: /scratch/gpfs/GRIFFITHS/chess-db/rawdata
  start_date: "2023-10-01"      # inclusive
  end_date: "2023-12-31"        # exclusive
  initial_clock: 600            # 10+0 base seconds
  clock_increment: 0
  min_elo: 2000
  threads: 40
  memory_limit: 64GB
  total_shards: 11

treegen:
  command: generate-dataset
  provider: stockfish
  engine_path: /home/hl4291/stockfish/src/stockfish
  fens: ${fens_sample}
  output_dir: ${trees_dir}/puctvalue_md36
  # PUCT is the live path (BeFS demoted to variants.befs -- see labnotebook
  # 2026-07-07: BeFS almost certainly shouldn't be the live path for a game
  # like chess and our branching regime; PUCT is the more defensible search).
  # Single currency end to end: value = p_win - p_loss, in [-1,1] -- PUCT's
  # exploration formula (Q + c_puct*prior*sqrt(N)/(1+n)) assumes a bounded,
  # roughly stationary value scale, which "value" provides and cp_order does
  # not; oracle_final_root_q_values/halt_reward must be win-probability-scaled
  # to match the meta-controller's actual downstream inputs and for
  # mc_pack.min_halt_reward_range to be meaningful. Default c_puct=1.0 is
  # already correctly calibrated for this scale, so no override is needed.
  selection: puct
  value_feature: value
  search_budget: ${search_budget}
  min_nodes: 96
  max_nodes: 96
  max_depth: 36
  sf_search_limit_nodes: 1
  seed: 42
  resume: true
  log_interval: 50

split:
  source_root: ${trees_dir}/puctvalue_md36
  # Populated by argmax_filter.slurm (pipeline.yaml: gen_trees -> argmax_filter ->
  # pack_trees), non-destructively -- gen_trees keeps every generated tree (100K,
  # ~17GB, not worth deleting anything), and this just picks the "thinking helps"
  # subset (argmax>2, ~24.7% -- see labnotebook 2026-07-07) for the meta-controller
  # branch only. engine_analysis_pwin/cp read source_root directly (unaffected).
  include_list: ${split_dir}/argmax_gt2_include_list.txt
  split_root: ${split_dir}
  validation_fraction: 0.2
  seed: 0
  clear: true

gnn_pack:
  split_root: ${split_dir}
  output_root: ${packed_dir}
  shard_size: 2000
  clear: true

mc_pack:
  split_root: ${split_dir}
  output_root: ${mc_packed_dir}
  shard_size: 500
  num_workers: 32
  reward_scale: 1.0
  min_halt_reward_range: 0.05
  min_decision_margin: 0.0
  search_budget: ${search_budget}
  max_depth: 36
  maintenance_scale: 0.0
  maintenance_ref_nodes: 30.0
  maintenance_exponent: 1.0    # exactly linear in node count (was 1.1, slightly superlinear)
  # time_lambda is NOT baked into anything the live path (pg_controller_train.py) reads --
  # oracle_value/target_advantages get recomputed fresh at train time from raw halt_rewards
  # (see train.time_lambda comment). It only still matters here for min_decision_margin
  # (currently 0.0/disabled), so this doesn't gate a repack -- kept at 0.01 purely so it's
  # not misleadingly stale if that filter is ever turned on. See labnotebook 2026-07-07.
  time_lambda: 0.01
  time_p: 2.8
  time_tau: 2.5
  time_delta: 1
  timeout_value: -1.0
  time_mode: linear           # shipped regime replaces power_law (degenerate — see normative.md)
  samples_per_bucket: 2
  fixed_budget: 96
  seed: 0
  clear: true

encoder:
  command: pretrain-child-wdl-encoder
  train_dir: ${packed_dir}/train_manifest.json
  validation_dir: ${packed_dir}/validation_manifest.json
  output_checkpoint: ${packed_dir}/tiny_encoder.pt
  device: cuda
  k: 1
  d_embed: 32
  d_message: 32
  node_embed_hidden: 32
  n_heads: 2
  d_att: 16
  decoder_hidden: 32
  batch_size: 256
  learning_rate: 1.0e-3
  epochs: 6
  loss_weight_by_subtree_size: true
  num_workers: 0
  log_interval: 20

materialize:
  encoder_checkpoint: ${packed_dir}/tiny_encoder.pt
  device: cuda
  episode_batch_size: 8
  max_snapshots_per_shard: 250000
  hidden_dim: 32
  hidden_layers: 2

train:
  metrics_run_name: mchalt
  packed_train_data: ${mc_packed_dir}/train_manifest.json
  packed_validation_data: ${mc_packed_dir}/validation_manifest.json
  materialized_train_cache: ${materialized_dir}/train_cache.pt
  materialized_validation_cache: ${materialized_dir}/validation_cache.pt
  encoder_checkpoint: ${packed_dir}/tiny_encoder.pt
  output_checkpoint: ${packed_dir}/mchalt_controller.pt
  device: cuda
  controller_inputs: ['z_t', 'T_t']
  k: 1
  node_embed_hidden: 32
  d_embed: 32
  d_message: 32
  n_heads: 2
  d_att: 16
  hidden_dim: 32
  hidden_layers: 2
  unfreeze_encoder: false
  separate_sign_head: false
  batch_size: 18000
  learning_rate: 3.0e-4              # was 2e-3 (overshot into sigmoid saturation on step 1)
  stop_temperature: 4.0             # soft stop policy; anneal -> 1 to avoid premature collapse
  stop_temperature_final: 1.0
  weight_decay: 0.0
  sign_loss_weight: 0.1
  sign_pos_weight: 1.0
  nontrivial_loss_weight: 1.0
  inverse_freq_weights: false
  epochs: 3
  validation_step_interval: 100
  greedy_eval_step_interval: 100
  metrics_log_interval: 20
  maintenance_scale: 0.0
  maintenance_ref_nodes: 30.0
  maintenance_exponent: 1.0    # exactly linear in node count (was 1.1, slightly superlinear)
  # time_lambda=10.0 was ~1000-3000x too large once value_feature became win-probability-scaled
  # (was cp-scale) -- recalibrated to 0.01 via a real data sweep on PUCT (the live path; see
  # labnotebook 2026-07-07). This field is NOT baked into packed data and needs no repack to
  # change: pg_controller_train.py's _episode_returns derives oracle_value fresh as max(g) at
  # train time (verified byte-identical to the old baked-in value on real data at matched
  # lambda), so mc_pack never needs to know about the cost model at all.
  time_lambda: 0.01
  time_mode: linear           # shipped regime replaces power_law (degenerate — see normative.md);
                              # convex shapes (quadratic/power_law) tested, no benefit over linear
                              # once calibrated (labnotebook 2026-07-07)
  time_p: 2.8
  time_tau: 2.5
  time_delta: 1
  timeout_value: -1.0
  samples_per_bucket: 2
  fixed_budget: 96  # NOTE: the comment this used to have ("must match mc_pack.fixed_budget or
                    # _validate_packed_manifest_oracle rejects the manifest") described the
                    # deprecated controller_train.py path; pg_controller_train.py (live) never
                    # calls that validation. Still keep these matched for clarity/sanity.
  seed: 0

eval:
  packed_root: ${mc_packed_dir}
  materialized_validation_cache: ${materialized_dir}/validation_cache.pt
  controller_checkpoint: ${packed_dir}/mchalt_controller.pt
  results_json: ${figures_dir}/results.json
  out_dir: ${figures_dir}
  time_mode: linear           # R-EVALUATE assessment regime (recorded here, not a hidden evaluate.py default)
  time_lambda: 0.01          # recalibrated from 10.0 -- see train.time_lambda comment above
  maintenance_scale: 0.0     # reverted from 0.1 (labnotebook 2026-07-08): that "sweet spot" was chosen
                              # BEFORE the maintenance re-sweep found no nonzero scale beats 0.0 for a
                              # non-degenerate global k*, and before the argmax>2 tree filter became the
                              # real fix for SingleHalt*'s collapse -- never reset after that pivot, so
                              # last night's real eval run collapsed all three controllers to identical,
                              # degenerate k*=0 results (frontier showed byte-identical SingleHalt*/
                              # Stats-Controller/z_t-Controller points). 0.0 is the validated regime where
                              # the argmax-filtered population gives a genuine k*=10 (see labnotebook).
  maintenance_exponent: 1.0   # exactly linear in node count (overridden here regardless of what mc_pack baked in)
  maint_lambda: 0.01          # lambda held fixed while sweeping maintenance_scale (delta_mean_regret_maintenance);
                              # recalibrated from 10.0, same fix as time_lambda above -- I missed this sibling
                              # field in the first pass (labnotebook 2026-07-07)
  max_episodes: 15000

# --- Normative variant branches (optional; piggy-back on the base run) ---
# A variant re-runs the model chain [from .. to] with `overrides`, reusing everything
# before `from` (and any `share`d inputs) from the base run. Its OUTPUTS fork to
# ${run_dir}/variants/<name> (figures too). Enable with RUN_VARIANTS=<name> bash submit_all.sh.
# NB the tail is the path from `from` to `to`, so board/engine (off other branches,
# and analysis-config anyway) are NOT forked.
variants:
  # `pruned` and `befs` variants removed 2026-07-08 (plan.md): both only overrode
  # `treegen.output_dir`, never `human_analysis.trees_default`/`split.source_root` (independent
  # hardcoded duplicates of the same path, not derived from it) -- so `argmax_filter`/`split`
  # would silently read from the un-forked base directory instead of either variant's actual
  # output if ever driven through RUN_VARIANTS end-to-end. Neither was confirmed to have been
  # run that way (found while wiring up `cp_regen` below, which overrides all three fields
  # correctly). Deleted rather than patched -- BeFS is already demoted to non-live (labnotebook
  # 2026-07-07) and pruning-alone is superseded by `cp_regen`, which bakes pruning in alongside
  # the value-function fix. Re-add properly (all three path fields) if either is needed again.
  cp_regen:
    # plan.md Agent 3 -- "CP done for real": regenerate under tanh(cp_order/300) instead of
    # the WDL-derived "value" column, PLUS pruning baked in from the start (T3's already-
    # validated relative/0.1 knobs), then run the REAL pipeline (not CP's shape-frozen
    # relabel-and-replay) end to end. See cp_regen.md for the full writeup.
    from: gen_trees                 # RE-RUN tree generation with the new value function + pruning ...
    to: eval                        # ... through the normative model, to eval
    share: [fens_sample]            # reuse the base tree-root FENs (grow the new trees on the same roots)
    overrides:                      # <section>.<field> — BuildTreeConfig's real fields
      treegen.value_feature: tanh_cp_value     # desaturated tanh(cp_order/T) instead of WDL "value"
      treegen.tanh_cp_temperature: 300.0       # T=300 (arbitrary per direct instruction; CP's null,
                                                # not negative, replay-test result -- see cp_recalibration.md)
      treegen.prune_mode: relative             # keep child iff value <= best + prune_epsilon
      treegen.prune_epsilon: 0.1               # T3-validated: cuts median width 1099->425, no yield cost.
                                                # tanh_cp_value is also bounded [-1,1] like "value", so this
                                                # threshold's scale reasoning (see `pruned` variant above)
                                                # still applies unchanged.
      treegen.output_dir: ${trees_dir}/cp_regen_tanh300_pruned
      # argmax_filter.slurm reads human_analysis.trees_default (NOT treegen.output_dir), and
      # pack_trees.slurm's split stage reads split.source_root (NOT treegen.output_dir either)
      # -- both are independent, hardcoded-duplicate anchors in the base config (see their own
      # comments), so BOTH must be overridden here too or argmax_filter/split would silently
      # look in the (non-existent, un-forked) puctvalue_md36 leaf under this variant's forked
      # trees_dir. Confirmed by reading argmax_filter.slurm + preprocess_gnn/split.py directly
      # (neither the `pruned` nor `befs` variant above overrides these -- plausibly never
      # actually driven through the full RUN_VARIANTS path end-to-end; not touching those,
      # this is cp_regen-local).
      human_analysis.trees_default: ${trees_dir}/cp_regen_tanh300_pruned
      split.source_root: ${trees_dir}/cp_regen_tanh300_pruned
      # NOT run at full production scale via submit_all.sh's fixed gen_trees array (0-159, full
      # 400K) -- smoke-scale generation is submitted manually (slurm/cp_regen_gen_trees.slurm,
      # VARIANT=cp_regen exported, small --array) at a scale similar to CP's ~16K-raw sample,
      # per plan.md's "smoke-scale first" instruction. Downstream steps (argmax_filter onward)
      # DO use the normal submit_all.sh RUN_VARIANTS=cp_regen path -- their array sizes just
      # process fewer real shards/episodes on a smaller corpus, no correctness issue.
